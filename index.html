<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방탈출 카페 — 세 개의 문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff1d6; --muted:#d9c4a0; --brass:#c99a4b; --brass-hi:#f0cf80; --dark:#120c1e;
  box-sizing:border-box;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--dark);color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3,button,.jua{font-family:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
.hall{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  padding:calc(26px + env(safe-area-inset-top,0px)) 18px calc(26px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(rgba(14,8,6,.28),rgba(14,8,6,.5)),var(--lobby) center/cover no-repeat fixed,#1a0f08}
.dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,220,160,.55);animation:float 14s linear infinite;opacity:0}
@keyframes float{0%{transform:translateY(40px);opacity:0}15%{opacity:.8}85%{opacity:.6}100%{transform:translateY(-70vh) translateX(30px);opacity:0}}
header{position:relative;z-index:2;text-align:center;margin-bottom:10px}
header h1{font-size:clamp(30px,5.5vw,52px);margin:0;color:var(--brass-hi);text-shadow:0 3px 0 #5a3410,0 6px 18px rgba(0,0,0,.7);letter-spacing:1px}
header p{margin:6px 0 0;color:var(--muted);font-size:clamp(15px,2.2vw,19px)}
.doors{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(230px,300px));gap:clamp(14px,3vw,34px);justify-content:center;margin:18px auto 0;width:100%;max-width:1040px}
.room{position:relative;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit;border-radius:18px;
  background:rgba(14,9,22,.55);border:3px solid rgba(201,154,75,.55);padding:12px 12px 14px;cursor:pointer;
  box-shadow:0 10px 26px rgba(0,0,0,.55);transition:transform .25s,box-shadow .25s,border-color .25s;-webkit-tap-highlight-color:transparent}
.room:hover,.room:focus-visible{transform:translateY(-6px);border-color:var(--glow,#ffd27a);box-shadow:0 16px 34px rgba(0,0,0,.6),0 0 28px var(--glow,#ffd27a);outline:none}
.room .art{width:100%;aspect-ratio:240/330;border-radius:12px;overflow:hidden;position:relative;background:#000}
.room .art img{display:block;width:100%;height:100%;object-fit:cover}
.room .leaf{transform-box:fill-box;transform-origin:0% 50%;transition:transform .7s cubic-bezier(.5,0,.2,1)}
.room.opening .leaf{transform:perspective(500px) rotateY(-62deg)}
.room h2,.room p,header p{word-break:keep-all;overflow-wrap:break-word}
.room h2{min-height:2.7em;display:flex;align-items:center;justify-content:center}
.room p{flex:1}
.room .go{margin-top:auto}
.room h2{margin:10px 0 2px;font-size:clamp(19px,2.6vw,23px);text-align:center;color:#fff3da}
.room .tag{font-size:14px;color:var(--muted);text-align:center;margin-bottom:6px}
.room p{margin:0 0 8px;font-size:15.5px;text-align:center;color:#ecdcb9;min-height:3.1em}
.meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:13.5px}
.meta span{background:rgba(255,255,255,.1);border:1.5px solid rgba(201,154,75,.5);border-radius:999px;padding:1px 10px;color:#ffeccb}
.go{margin-top:10px;font-family:"Jua",sans-serif;font-size:18px;color:#2b1805;background:linear-gradient(#f3c870,#c88a36);border:2px solid #5b3412;border-radius:12px;padding:7px 22px;box-shadow:0 3px 0 #4a2a0c}
.room.locked{cursor:not-allowed;filter:saturate(.55) brightness(.8)}
.room.locked:hover{transform:none;box-shadow:0 10px 26px rgba(0,0,0,.55);border-color:rgba(201,154,75,.55)}
.room.locked .go{background:rgba(255,255,255,.14);color:#e9d8b5;border-color:rgba(201,154,75,.5);box-shadow:none}
.ribbon{position:absolute;top:18px;right:-6px;background:#b4332a;color:#fff;font-family:"Jua",sans-serif;font-size:14px;padding:2px 12px;border-radius:6px 0 0 6px;box-shadow:0 3px 6px rgba(0,0,0,.5);z-index:3}
.ribbon.soon{background:#555b73}
footer{position:relative;z-index:2;margin-top:auto;padding-top:26px;text-align:center;color:var(--muted);font-size:15px}
.team{display:inline-block;margin-top:8px;background:rgba(255,255,255,.08);border:2px dashed rgba(201,154,75,.55);border-radius:12px;padding:6px 16px;color:#e9d8b5}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);z-index:10;
  background:rgba(44,22,8,.92);color:#ffeccb;border:3px solid var(--brass);border-radius:12px;padding:10px 20px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:860px){ .doors{grid-template-columns:minmax(0,340px)} .room .art{aspect-ratio:240/250} }
@media (prefers-reduced-motion: reduce){ .dust i{animation:none} .room,.room .leaf{transition:none} }
</style>
</head>
<body>
<div class="hall">
  <div class="dust" id="dust"></div>
  <header>
    <h1>방탈출 카페</h1>
    <p>문을 하나 골라 들어가세요. 제한 시간 안에 단서를 찾아 탈출하는 거예요!</p>
  </header>
  <main class="doors" id="doors" aria-label="방 선택"></main>
  <footer>
    <div>초등 5~6학년을 위한 방탈출 · 방마다 이야기와 분위기가 달라요</div>
    <div class="team">👥 친구와 함께 탈출하기 — 곧 열려요</div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

var ROOMS=[
  { id:"wizard", title:"마법사의 서재에서 탈출하라!", tag:"신비로운 · 마법 · 추리",
    teaser:"사라진 마법사가 남긴 세 조각의 열쇠를 찾아라.",
    url:"wizard.html", ready:true, time:25, level:2, glow:"#ffd27a", img:IMG_T_WIZARD },
  { id:"lab", title:"이상한 과학자의 실험실", tag:"엉뚱한 · 발명 · 과학",
    teaser:"뚝딱 박사의 기계가 고장 났다! 박사를 되돌려 놓아라.",
    url:"lab.html", ready:true, time:25, level:3, glow:"#7ff5c8", fresh:true, img:IMG_T_LAB },
  { id:"haunted", title:"할로윈 유령의 집", tag:"으스스 · 귀여운 · 할로윈",
    teaser:"외로운 꼬마 유령이 건 문을 열고 자정 전에 나가라.",
    url:"haunted.html", ready:true, time:25, level:3, glow:"#ff9a2e", fresh:true, img:IMG_T_HAUNTED }
];

var STAR=function(n){ var s=""; for(var i=0;i<3;i++) s+=i<n?"★":"☆"; return s; };
var doors=document.getElementById("doors");
ROOMS.forEach(function(r){
  var a=document.createElement(r.ready?"a":"div");
  a.className="room"+(r.ready?"":" locked"); a.style.setProperty("--glow",r.glow);
  if(r.ready){ a.href=r.url; } else { a.setAttribute("role","button"); a.tabIndex=0; }
  a.setAttribute("aria-label",r.title+(r.ready?" 입장":" (준비 중)"));
  a.innerHTML=(r.ready?(r.fresh?'<div class="ribbon">NEW</div>':''):'<div class="ribbon soon">준비 중</div>')+
    '<div class="art"><img alt="" src="'+r.img+'"></div>'+
    '<h2>'+r.title+'</h2><div class="tag">'+r.tag+'</div><p>'+r.teaser+'</p>'+
    '<div class="meta"><span>⏱ '+r.time+'분</span><span>난이도 '+STAR(r.level)+'</span><span>5~6학년</span></div>'+
    '<div class="go">'+(r.ready?'🚪 입장하기':'🔒 곧 열려요')+'</div>';
  if(r.ready){ a.addEventListener("click",function(){ a.classList.add("opening"); setTimeout(function(){ a.classList.remove("opening"); },1500); }); }
  else{
    var show=function(){ var t=document.getElementById("toast"); t.textContent="🔒 「"+r.title+"」은(는) 아직 만드는 중이에요. 곧 열려요!"; t.classList.add("show"); clearTimeout(show.t); show.t=setTimeout(function(){ t.classList.remove("show"); },2600); };
    a.addEventListener("click",show); a.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); show(); } });
  }
  doors.appendChild(a);
});
/* 먼지 반짝임 */
var d=document.getElementById("dust");
for(var i=0;i<26;i++){ var p=document.createElement("i"); p.style.left=(Math.random()*100)+"%"; p.style.bottom=(Math.random()*30)+"%"; p.style.animationDelay=(-Math.random()*14)+"s"; p.style.animationDuration=(10+Math.random()*10)+"s"; d.appendChild(p); }
